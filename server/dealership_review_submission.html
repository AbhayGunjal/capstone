<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post Review</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        margin: 0;
        color: #1f2937;
      }
      .topbar {
        background: #123b6b;
        color: white;
        padding: 18px 24px;
        font-size: 22px;
        font-weight: bold;
      }
      .container {
        max-width: 760px;
        margin: 30px auto;
        background: white;
        border-radius: 14px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        padding: 30px;
      }
      h2 { margin-top: 0; }
      form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
      }
      .full { grid-column: 1 / -1; }
      input, select, textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid #d0d7e2;
        border-radius: 8px;
        font-size: 15px;
      }
      textarea { min-height: 110px; resize: vertical; }
      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
      }
      .checkbox-row input { width: auto; }
      button {
        margin-top: 10px;
        background: #0d8a5d;
        color: white;
        border: none;
        padding: 12px 18px;
        font-size: 15px;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="topbar">Cars Dealership</div>
    <div class="container">
      <h2>Post Review</h2>
      <form>
        <div>
          <label for="name">Name</label>
          <input id="name" type="text" value="Abhishek" />
        </div>
        <div>
          <label for="dealership">Dealership ID</label>
          <input id="dealership" type="number" value="2" />
        </div>
        <div class="full">
          <label for="review">Review</label>
          <textarea id="review">The process was smooth and the staff was very friendly. I would definitely buy from here again.</textarea>
        </div>
        <div class="full checkbox-row">
          <input id="purchase" type="checkbox" checked />
          <label for="purchase" style="margin: 0;">Purchased a vehicle</label>
        </div>
        <div>
          <label for="purchase_date">Purchase Date</label>
          <input id="purchase_date" type="date" value="2026-09-25" />
        </div>
        <div>
          <label for="car_make">Car Make</label>
          <input id="car_make" type="text" value="Honda" />
        </div>
        <div>
          <label for="car_model">Car Model</label>
          <input id="car_model" type="text" value="Civic" />
        </div>
        <div>
          <label for="car_year">Car Year</label>
          <input id="car_year" type="number" value="2023" />
        </div>
        <div class="full">
          <button type="button">Submit Review</button>
        </div>
      </form>
    </div>
  </body>
</html>
